# ============================================================================
#  GTA6-SHORTS — configuração
#  Edita os valores à direita do "=" e grava o ficheiro. Linhas com # são notas.
# ============================================================================

[predefinicoes]
# Valores usados quando não os indicas no pedido.
cortes  = 5          # quantos Shorts gerar (1 a 30)
duracao = 30         # segundos por Short (5 a 180)
idioma  = "pt-BR"    # pt-BR | pt-PT | en | auto
estilo  = "gaming"   # gaming (Gaming dinâmico) | minimal (Minimalista) | viral (Viral com motion graphics)
formato = "9:16"     # 9:16 (Shorts/TikTok/Reels) | 1:1 | 4:5 | 16:9

[saida]
pasta = "output"     # onde ficam todos os resultados (relativo à pasta do projeto)

[avancado]
# Só mexer se souberes o que estás a fazer.
modelo      = "large-v3-turbo"  # modelo de transcrição (large-v3-turbo na GPU; medium para CPU)
dispositivo = "auto"            # auto | cuda (GPU) | cpu
encoder     = "auto"            # auto (NVENC da RTX, com recurso a x264) | nvenc | x264
teaser      = true              # abrir os estilos gaming/viral com o momento mais forte
seguimento_movimento = 0.0      # enquadramento 9:16: 0 = centro fixo (ideal para jogos na 3.ª pessoa);
                                # 0.1–0.3 = o crop desloca-se para onde há movimento (ex.: vlogs, 1.ª pessoa)
espaco_minimo_gb = 5            # recusar se houver menos espaço livre em disco
duracao_min_fator = 0.85        # cada corte fica entre 85%...
duracao_max_fator = 1.15        # ...e 115% da duração pedida (ex.: 45 s -> 38 a 52 s)
